[project]
name = "dart"
version = "0.1.0"
description = "Undergraduate research project: expanding deep-sea temperature visibility through re-purposing existing GeoNet's DART infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argopy>=1.3",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "pandas>=2.3",
    "requests>=2.32",
    "scipy>=1.16",
    "xarray>=2025.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.1",
    "jupyter>=1.1",
    "notebook>=7.6",
]

[tool.setuptools]
packages = []
